services:
  booking:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: ${BACKEND_API_URL:-http://host.docker.internal:8011}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BACKEND_API_URL: ${BACKEND_API_URL:-http://host.docker.internal:8011}
    ports:
      - "${BOOKING_PORT:-3004}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
